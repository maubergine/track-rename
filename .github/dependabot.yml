version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    # init and analyze must share a version; bump them in one PR.
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
    labels:
      - dependencies
      - github-actions

  # The npm entry covers the dev-only package.json (commitlint, semantic-release).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
